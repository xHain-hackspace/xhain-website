name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout (optional, uses triggering ref if not specified)"
        required: false
        type: string
      base-url:
        description: "Base URL for the website"
        required: false
        type: string
    outputs:
      artifact-name:
        description: "Name of the build artifact"
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.set-output.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Read Hugo version from .hvm
        id: hugo-version
        # .hvm file is used by hvm (Hugo Version Manager) locally via --useVersionInDotFile
        # See: https://github.com/jmooring/hvm
        run: echo "version=$(cat .hvm | tr -d 'v')" >> $GITHUB_OUTPUT

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78  # v3.2.1
        with:
          hugo-version: ${{ steps.hugo-version.outputs.version }}
          extended: true

      - name: Build
        env:
          HUGO_BASEURL: ${{ inputs.base-url }}
        run: |
          sudo ln -sf /usr/share/zoneinfo/Europe/Berlin /etc/localtime
          hugo env
          hugo -d public_html --config config.toml --cleanDestinationDir

      - name: Set artifact name
        id: set-output
        run: echo "artifact-name=build-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-${{ github.sha }}
          path: public_html/
          retention-days: 5
          include-hidden-files: true
